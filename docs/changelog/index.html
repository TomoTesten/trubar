<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zadnje spremembe — T.R.U.B.A.R.</title>
<link rel="stylesheet" href="/trubar/style.css">
<style>
.changelog-list { list-style: none; padding: 0; }
.changelog-list li { padding: 10px 0; border-bottom: 1px solid #f0f0f0; display: flex; gap: 12px; align-items: baseline; }
.cl-date { color: #888; font-size: 0.82rem; min-width: 90px; }
.cl-kratica { font-weight: 700; min-width: 100px; }
.cl-subject { font-size: 0.88rem; color: #444; }
</style>
</head>
<body>
<header>
  <nav><a href="/trubar/">← T.R.U.B.A.R.</a></nav>
  <h1 class="law-title">Zadnje spremembe predpisov</h1>
</header>
<div class="container" style="max-width:900px;margin:0 auto;padding:24px 16px">
  <p style="color:#555;margin-bottom:16px">Zadnjih 200 sprememb v repozitoriju, od najnovejše.</p>
  <ul class="changelog-list" id="cl"></ul>
</div>
<footer><a href="/trubar/">Domov</a> · CC0 · <a href="/trubar/changelog.json">JSON feed</a></footer>
<script>
fetch('/trubar/data/changelog.json')
  .then(r => r.json())
  .then(items => {
    const ul = document.getElementById('cl');
    ul.innerHTML = items.map(i =>
      `<li><span class="cl-date">${i.date}</span><span class="cl-kratica"><a href="${i.url}">${i.kratica}</a></span><span class="cl-subject">${i.subject.replace(/</g,'&lt;')}</span></li>`
    ).join('');
  });
</script>
</body>
</html>
